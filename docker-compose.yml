services:
  backend:
    build: ./backend
    container_name: cityboost-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    environment:
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - cityboost-net

  db:
    image: postgres:16-alpine
    container_name: cityboost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityboost} -d ${POSTGRES_DB:-cityboost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cityboost-net

  redis:
    image: redis:7-alpine
    container_name: cityboost-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cityboost-net

  nginx:
    image: nginx:1.27-alpine
    container_name: cityboost-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/app/storage:ro
      # TLS: раскомментируйте после выпуска сертификата
      # (см. docs/DEPLOY_UBUNTU.md).
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    networks:
      - cityboost-net

  frontend:
    build: ./frontend
    container_name: cityboost-frontend-builder
    restart: "no"
    volumes:
      - frontend-dist:/dist
    networks:
      - cityboost-net

networks:
  cityboost-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  frontend-dist:
