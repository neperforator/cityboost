services:
  backend:
    build: ./backend
    container_name: cityboost-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    environment:
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cityboost-net

  db:
    image: postgres:16-alpine
    container_name: cityboost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityboost} -d ${POSTGRES_DB:-cityboost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - cityboost-net

  redis:
    image: redis:7-alpine
    container_name: cityboost-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    logging: *default-logging
    networks:
      - cityboost-net

  nginx:
    image: nginx:1.27-alpine
    container_name: cityboost-nginx
    restart: unless-stopped
    environment:
      # Тот же DEBUG, что у backend: при true лимиты nginx отключаются,
      # а docs остаются доступны.
      DEBUG: ${DEBUG:-false}
      # Дублирует ENABLE_DOCS из backend: если оба флага false, nginx
      # отдаёт 404 на /docs, /redoc и /openapi.json.
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      # Шаблон: entrypoint собирает из него conf.d/default.conf при старте.
      # После правки nginx/default.conf нужен `docker compose restart nginx`.
      - ./nginx/default.conf:/etc/nginx/templates/default.conf:ro
      - ./nginx/docker-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - ./storage:/app/storage:ro
      # TLS: каталоги монтируются всегда; до выпуска сертификата они пустые.
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    # Compose при переопределении entrypoint не передаёт CMD образа,
    # поэтому команду задаём явно.
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    logging: *default-logging
    networks:
      - cityboost-net

  frontend:
    build: ./frontend
    container_name: cityboost-frontend-builder
    restart: "no"
    volumes:
      - frontend-dist:/dist
    logging: *default-logging
    networks:
      - cityboost-net

networks:
  cityboost-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  frontend-dist:
