services:
  backend:
    build: ./backend
    container_name: cityboost-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    environment:
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - cityboost-net

  db:
    image: postgres:16-alpine
    container_name: cityboost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityboost} -d ${POSTGRES_DB:-cityboost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cityboost-net

  redis:
    image: redis:7-alpine
    container_name: cityboost-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cityboost-net

  nginx:
    image: nginx:1.27-alpine
    container_name: cityboost-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/app/storage:ro
      # TLS: раскомментируйте после выпуска сертификата
      # (см. docs/DEPLOY_UBUNTU.md).
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    networks:
      - cityboost-net

  frontend:
    build: ./frontend
    container_name: cityboost-frontend-builder
    restart: "no"
    volumes:
      - frontend-dist:/dist
    networks:
      - cityboost-net

  # Изолированный мониторинг с алертами в Telegram.
  # Удаляется без изменений в backend/frontend: см. ops/health-alert/README.md
  health-alert:
    build: ./ops/health-alert
    container_name: cityboost-health-alert
    restart: on-failure
    environment:
      HEALTH_ALERT_ENABLED: ${HEALTH_ALERT_ENABLED:-true}
      HEALTH_ALERT_DRY_RUN: ${HEALTH_ALERT_DRY_RUN:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MESSAGE_THREAD_ID: ${TELEGRAM_MESSAGE_THREAD_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      HEALTH_ALERT_INTERVAL_SECONDS: ${HEALTH_ALERT_INTERVAL_SECONDS:-60}
      HEALTH_ALERT_TIMEOUT_SECONDS: ${HEALTH_ALERT_TIMEOUT_SECONDS:-5}
      HEALTH_ALERT_FAILURE_THRESHOLD: ${HEALTH_ALERT_FAILURE_THRESHOLD:-2}
      HEALTH_ALERT_REPEAT_MINUTES: ${HEALTH_ALERT_REPEAT_MINUTES:-30}
      HEALTH_ALERT_STARTUP_DELAY_SECONDS: ${HEALTH_ALERT_STARTUP_DELAY_SECONDS:-20}
      HEALTH_ALERT_TIMEZONE: ${HEALTH_ALERT_TIMEZONE:-Europe/Minsk}
      HEALTH_ALERT_EXTERNAL_URL: ${HEALTH_ALERT_EXTERNAL_URL:-}
      HEALTH_ALERT_CHECK_DB: ${HEALTH_ALERT_CHECK_DB:-true}
      HEALTH_ALERT_CHECK_REDIS: ${HEALTH_ALERT_CHECK_REDIS:-true}
    networks:
      - cityboost-net
    security_opt:
      - no-new-privileges:true

networks:
  cityboost-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  frontend-dist:
